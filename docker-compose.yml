services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yt_payment
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/YT_USER
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3003:3003"
    depends_on: [mongo]

  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongo:27017/YT_VIDEO
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3004:3004"
    depends_on: [mongo]

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    environment:
      PORT: 3005
      MYSQL_URL: jdbc:mysql://mysql:3306/yt_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      VIDEO_SERVICE_URL: http://video-service:3004
      USER_SERVICE_URL: http://user-service:3003
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3005:3005"
    depends_on:
      - mysql
      - user-service
      - video-service

volumes:
  mongo-data:
  mysql-data:
