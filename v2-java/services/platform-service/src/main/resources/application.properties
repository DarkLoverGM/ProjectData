# Doc bien moi truong tu server-java/.env (dinh dang KEY = value), khong dung server/.env cua ban Node.
# Bien moi truong that cua he dieu hanh van duoc uu tien hon file nay.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:3001}
server.address=0.0.0.0

# Thu muc goc cua repo hello-react (chua build/, public/, server/data, server/uploads)
app.root-dir=${APP_ROOT_DIR:..}

# MongoDB (Spring Data): cung bien MONGO_URI voi server/models/connectDB.js.
# Dung 127.0.0.1 thay vi localhost (mongod mac dinh chi nghe IPv4)
spring.data.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/${DB_NAME:YT}}
spring.data.mongodb.auto-index-creation=false

# JWT: giong verifyJWT.js / AuthServices.js
# Mac dinh chi de chay thu tren may moi khong can .env; trien khai that phai dat JWT_SECRET rieng
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-hello-react-change-me-2026}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:${JWT_SECRET}_refresh}
app.jwt.access-expires=${ACCESS_TOKEN_EXPIRES:15m}
app.jwt.refresh-expires=${REFRESH_TOKEN_EXPIRES:7d}
app.cookie.secure=${COOKIE_SECURE:false}
# Ky device id (DeviceIds), giong middleware/deviceId.js
app.cookie.secret=${COOKIE_SECRET:${JWT_SECRET}}
# So request /api xu ly cung luc toi da (LoadSheddingFilter), giong middleware/loadShedding.js
app.max-in-flight=${MAX_IN_FLIGHT:100}

# Dang nhap Google (OAuth 2.0), cung key voi ban Node trong server/.env
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
# Trang frontend se chuyen ve sau khi dang nhap Google / thanh toan xong
app.client-url=${CLIENT_URL:http://localhost:3000}
# Dia chi server nay ma trinh duyet / cong thanh toan goi toi duoc (return URL, IPN cua MoMo, VNPay)
app.server-url=${SERVER_URL:http://localhost:${PORT:3001}}

# Thanh toan (payment/*Gateway). Thieu key cong nao thi cong do bi an tren giao dien.
# MoMo: mac dinh la bo key TEST cong khai trong tai lieu / code mau cua MoMo (test-payment.momo.vn),
# chi dung de thu, khong tru tien that. Khi dung that thay bang key cua doanh nghiep qua bien moi truong.
app.payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
app.payment.momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
app.payment.momo.access-key=${MOMO_ACCESS_KEY:F8BBA842ECF85}
app.payment.momo.secret-key=${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
# VNPay: mac dinh la key SANDBOX cua nhom (sandbox.vnpayment.vn, khong tru tien that) de may khac thanh toan thu duoc ngay.
# Dang ky sandbox rieng mien phi tai https://sandbox.vnpayment.vn/devreg/ roi dat VNPAY_TMN_CODE / VNPAY_HASH_SECRET
app.payment.vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:VECYNM3I}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:MSUKOXWHTWZSFPPVRWGLGDRUWRZTXJUH}

# Gui OTP qua Gmail (giong nodemailer service 'gmail')
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_SENDER_EMAIL:}
spring.mail.password=${MAIL_SENDER_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Firebase (common/FirebaseCredentials): service account dung cho Storage (common/FileStorage)
# va push notification (service/PushService). FIREBASE_SERVICE_ACCOUNT_PATH tinh tu thu muc server-java/.
# Khong co bucket thi luu local o server/uploads; khong co service account thi khong gui push
app.firebase.bucket=${FIREBASE_STORAGE_BUCKET:}
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.client-email=${FIREBASE_CLIENT_EMAIL:}
app.firebase.private-key=${FIREBASE_PRIVATE_KEY:}

# Du lieu mau (seed/DataSeeder): DB trong thi nap server-java/seed/*.jsonl, giai nen seed/seed-media.zip
app.seed.enabled=${APP_SEED_ENABLED:true}

# Doi thumbnail sang WebP (common/WebpConverter): can ffmpeg co libwebp. Khong co thi giu nguyen dinh dang goc
app.ffmpeg-path=${FFMPEG_PATH:ffmpeg}

# Upload: video dai toi da 2GB (gioi han chi tiet kiem tra trong VideoController / ImageUpload)
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2100MB
server.tomcat.max-swallow-size=-1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always
